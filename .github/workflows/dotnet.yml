name: .NET

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Restore
        run: dotnet tool restore
      - name: Paket install
        run: dotnet paket install
      - name: Build
        run: dotnet build src/MainProj.fsproj -c Release
      - name: Test
        run: dotnet run --project tests/Tests.fsproj -c Release
      - name: Deploy
        run: |
          mkdir -p deploy
          dotnet publish src/MainProj.fsproj -c Release -o deploy --runtime linux-x64 --no-build
      - name: Copy .env to deploy
        if: hashFiles('.env') != ''
        run: cp .env deploy/
      - uses: actions/upload-artifact@v4
        with:
          name: my-artifact
          path: deploy
